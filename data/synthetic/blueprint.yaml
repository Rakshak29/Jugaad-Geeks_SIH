modules:
  - id: payment-service
    name: Payment Service
    repo_name: acmepay/payment-service
    path_prefixes: ["services/payment/", "cmd/payment/"]
    jira_component: payment-service
    service_tag: payment-service
    description: Core credit card intent creation, payment routing, and transaction state machine.

  - id: fraud-service
    name: Fraud Service
    repo_name: acmepay/fraud-service
    path_prefixes: ["services/fraud/", "pkg/risk/"]
    jira_component: fraud-service
    service_tag: fraud-service
    description: Real-time fraud detection engine, velocity checks, and risk scoring ML pipelines.

  - id: auth-service
    name: Authentication Service
    repo_name: acmepay/auth-service
    path_prefixes: ["services/auth/", "pkg/crypto/"]
    jira_component: auth-service
    service_tag: auth-service
    description: JWT authentication, OAuth2 token issuing, KMS key vault wrapper, and RBAC authorization.

  - id: ledger-service
    name: Ledger Service
    repo_name: acmepay/ledger-service
    path_prefixes: ["services/ledger/", "db/ledger/"]
    jira_component: ledger-service
    service_tag: ledger-service
    description: Double-entry accounting ledger, transaction journal logging, and balance integrity verification.

  - id: notification-service
    name: Notification Service
    repo_name: acmepay/notification-service
    path_prefixes: ["services/notification/", "pkg/webhook/"]
    jira_component: notification-service
    service_tag: notification-service
    description: Event-driven webhook delivery, SMS/email alerts, and customer payout notifications.

  - id: user-service
    name: User Service
    repo_name: acmepay/user-service
    path_prefixes: ["services/user/", "pkg/identity/"]
    jira_component: user-service
    service_tag: user-service
    description: Merchant profiles, KYC documentation handling, and user account lifecycle management.

  - id: reporting-service
    name: Reporting Service
    repo_name: acmepay/reporting-service
    path_prefixes: ["services/reporting/", "jobs/analytics/"]
    jira_component: reporting-service
    service_tag: reporting-service
    description: Financial audit report generation, daily settlement summaries, and merchant analytics.

  - id: settlement-service
    name: Settlement Service
    repo_name: acmepay/settlement-service
    path_prefixes: ["services/settlement/", "pkg/ach/"]
    jira_component: settlement-service
    service_tag: settlement-service
    description: Automated ACH clearing, banking payout batches, and cross-border currency conversion.

  - id: api-gateway
    name: API Gateway
    repo_name: acmepay/api-gateway
    path_prefixes: ["services/api-gateway/", "config/gateway/"]
    jira_component: api-gateway
    service_tag: api-gateway
    description: Ingress routing, SSL termination, rate limiting middleware, and OpenAPI specs.

  - id: deployment-service
    name: Deployment Service
    repo_name: acmepay/deployment-service
    path_prefixes: ["deployments/", ".github/workflows/"]
    jira_component: deployment-service
    service_tag: deployment-service
    description: Helm chart releases, Kubernetes deployment manifests, canary rollouts, and rollback triggers.

  - id: monitoring-service
    name: Monitoring Service
    repo_name: acmepay/monitoring-service
    path_prefixes: ["monitoring/", "config/alerts/"]
    jira_component: monitoring-service
    service_tag: monitoring-service
    description: Prometheus alert rules, Grafana dashboards, and PagerDuty incident routing configurations.

  - id: compliance-service
    name: Compliance Service
    repo_name: acmepay/compliance-service
    path_prefixes: ["services/compliance/", "audit/"]
    jira_component: compliance-service
    service_tag: compliance-service
    description: PCI-DSS compliance verification, audit trail logging, and data privacy enforcement.

capabilities:
  - id: Payment Processing
    name: Payment Processing
    description: Designing, executing, and maintaining credit card payment routing and state transitions.

  - id: Fraud Detection
    name: Fraud Detection
    description: Implementing risk evaluation algorithms, transaction velocity rules, and fraud prevention.

  - id: Authentication
    name: Authentication
    description: Managing token generation, JWT verification, OAuth2 flows, and identity validation.

  - id: Authorization
    name: Authorization
    description: Implementing role-based access control, scope enforcement, and secure API permissions.

  - id: Ledger Management
    name: Ledger Management
    description: Maintaining double-entry journal balance books, financial reconciliation, and ledger integrity.

  - id: Notifications
    name: Notifications
    description: Building webhook dispatcher systems, automated SMS/email alerts, and event notification queues.

  - id: User Management
    name: User Management
    description: Building user profiles, KYC onboarding workflows, and merchant account controls.

  - id: Reporting
    name: Reporting
    description: Creating analytics export jobs, audit logs, and financial transaction summary reports.

  - id: Settlement Processing
    name: Settlement Processing
    description: Managing ACH clearing batches, bank payout reconciliation, and settlement execution.

  - id: API Management
    name: API Management
    description: Configuring ingress API gateways, OpenAPI schemas, rate limiting, and request proxies.

  - id: Deployment Management
    name: Deployment Management
    description: Automating CI/CD pipelines, Kubernetes manifests, canary deployments, and zero-downtime rollbacks.

  - id: Monitoring
    name: Monitoring
    description: Configuring Prometheus metrics, Grafana dashboards, latency traces, and log aggregation.

  - id: Incident Response
    name: Incident Response
    description: Leading emergency incident response bridges, root-cause troubleshooting, and hotfix rollouts.

  - id: Compliance
    name: Compliance
    description: Enforcing PCI-DSS standards, audit logging standards, and data retention policies.

  - id: Data Analysis
    name: Data Analysis
    description: Analyzing payment throughput trends, failure rates, and transaction data anomalies.

