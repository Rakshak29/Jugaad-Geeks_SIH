# --- DEMONSTRATION SCENARIOS ---

demonstration_scenarios:
  case_1_knowledge_concentration:
    capability: Ledger Management
    target_module: ledger-service
    primary_employee_id: E10  # Rohan Gupta
    rationale: >
      85% of commits, architectural docs, and incident leadership for double-entry ledger balance matching
      belong to E10. If E10 is marked UNAVAILABLE in simulation, Ledger Management status drops directly to LOST.

  case_2_stale_evidence:
    capability: Authentication
    target_module: auth-service
    stale_employee_id: E08  # Vikram Malhotra
    historical_period: "2023-01-01 to 2023-12-31"
    recent_period: "2024-01-01 to 2026-08-01"
    rationale: >
      E08 authored 40+ commits on KMS auth vault in 2023 but has zero commits or activity in 2025–2026.
      The recency decay algorithm degrades E08's credibility score to LOW/NONE, while E02 has recent 2026 evidence.

  case_3_multi_module_employee:
    employees: [E01, E04, E06]
    rationale: >
      E01 works across api-gateway, payment-service, and auth-service. E04 works on payment-service and settlement-service.
      E06 works on deployment-service, monitoring-service, and api-gateway. Demonstrates broad architectural impact.

  case_4_distributed_knowledge:
    capability: API Management
    target_module: api-gateway
    distributed_employee_ids: [E01, E02, E04, E06, E11, E15]
    rationale: >
      API Management has strong, recent evidence across 6 employees. If any single engineer is marked UNAVAILABLE,
      the capability coverage status remains MAINTAINED with zero residual gaps.

  case_5_cross_source_identity_resolution:
    employee_id: E01
    representations:
      github: Rakshak29
      jira: rakshak.shetty
      documentation: Rakshak Shetty
      deployment: r.shetty
      incident: Rakshak
    rationale: >
      The discovery pipeline's Identity Resolver must infer that these 5 source handles map to E01 using handle,
      name, and email heuristics.

  case_6_ambiguous_conflicting_evidence:
    employee_id: E17  # Pooja Bhatia
    doc_activity: High (authored 12 architecture docs on API Gateway)
    code_activity: Zero (0 git commits, 0 PR merges in api-gateway)
    rationale: >
      E17 has doc-authoring evidence for API Management (Observed provenance, low weight) but zero engineering commits.
      The evidence engine will weight engineering commits over doc authorship, preventing false high-credibility assignments.

