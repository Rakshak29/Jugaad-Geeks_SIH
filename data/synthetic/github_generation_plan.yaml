module_discovery_signals:
  payment-service:
    path_keywords: [services/payment/, cmd/payment/]
    domain_terms: [payment intent, card routing, payment_processor, transaction state machine, capture_payment, refund_handler]
  fraud-service:
    path_keywords: [services/fraud/, pkg/risk/]
    domain_terms: [risk evaluation, velocity rule, fraud score, ml model, blacklist check, fraud_evaluator]
  auth-service:
    path_keywords: [services/auth/, pkg/crypto/]
    domain_terms: [jwt issuer, oauth token, kms key vault, rbac middleware, auth_token, password hash]
  ledger-service:
    path_keywords: [services/ledger/, db/ledger/]
    domain_terms: [double-entry journal, ledger balance, debit credit matching, balance verifier, audit trail]
  notification-service:
    path_keywords: [services/notification/, pkg/webhook/]
    domain_terms: [webhook dispatcher, sms gateway, email template, notification queue, event subscriber]
  user-service:
    path_keywords: [services/user/, pkg/identity/]
    domain_terms: [merchant profile, kyc verification, user account, merchant onboarding, profile controller]
  reporting-service:
    path_keywords: [services/reporting/, jobs/analytics/]
    domain_terms: [daily settlement report, audit export, transaction summary, csv exporter, analytics job]
  settlement-service:
    path_keywords: [services/settlement/, pkg/ach/]
    domain_terms: [ach clearing, payout batcher, bank reconciliation, swift routing, settlement clearing]
  api-gateway:
    path_keywords: [services/api-gateway/, config/gateway/]
    domain_terms: [ingress proxy, rate limiter, openapi spec, request router, cors middleware, api key proxy]
  deployment-service:
    path_keywords: [deployments/, .github/workflows/]
    domain_terms: [helm values, canary rollout, github workflow, k8s manifest, blue-green deployment]
  monitoring-service:
    path_keywords: [monitoring/, config/alerts/]
    domain_terms: [prometheus alert, grafana dashboard, latency metric, alertmanager routing, p99 trace]
  compliance-service:
    path_keywords: [services/compliance/, audit/]
    domain_terms: [pci sanitizer, audit logger, data retention policy, privacy compliance, sensitive data scrubbing]

capability_discovery_signals:
  Payment Processing:
    technical_concepts: [intent routing, payment capture, credit card validation, retry backoff, idempotency key]
    code_elements: [ProcessPayment(), RouteIntent(), CaptureCharge(), ValidateCard()]
  Fraud Detection:
    technical_concepts: [risk score, velocity limit, blacklist IP, fraud probability, anomaly detection]
    code_elements: [EvaluateRisk(), CheckVelocity(), IsBlacklisted(), ComputeFraudScore()]
  Authentication:
    technical_concepts: [jwt signing, bearer token, oauth2 flow, token validation, password hashing]
    code_elements: [IssueToken(), VerifyJWT(), AuthenticateUser(), HashPassword()]
  Authorization:
    technical_concepts: [rbac role, scope check, permission matrix, resource access, token claims]
    code_elements: [AuthorizeRole(), HasPermission(), EnforceScope(), ValidateClaims()]
  Ledger Management:
    technical_concepts: [double-entry, debit credit, balance integrity, journal entry, account ledger]
    code_elements: [PostJournalEntry(), VerifyBalance(), MatchDebitsCredits(), AuditLedger()]
  Notifications:
    technical_concepts: [webhook payload, delivery retry, sms notification, email alert, event broadcast]
    code_elements: [DispatchWebhook(), SendSMS(), TriggerEmailAlert(), BroadcastEvent()]
  User Management:
    technical_concepts: [merchant onboarding, kyc document, profile update, account suspension]
    code_elements: [CreateUser(), VerifyKYC(), UpdateMerchantProfile(), SuspendAccount()]
  Reporting:
    technical_concepts: [settlement summary, daily export, transaction report, analytics pipeline]
    code_elements: [GenerateDailyReport(), ExportAuditCSV(), AggregateTransactions()]
  Settlement Processing:
    technical_concepts: [ach batch, clearing file, bank payout, fund transfer, settlement window]
    code_elements: [ExecuteACHClearing(), BatchPayouts(), ReconcileBankStatements()]
  API Management:
    technical_concepts: [rate limiting, ingress routing, swagger openapi, cors policy, proxy buffer]
    code_elements: [RateLimitRequest(), RouteIngress(), ServeOpenAPI(), FilterCORS()]
  Deployment Management:
    technical_concepts: [k8s rollout, canary deploy, helm upgrade, workflow execution, rollback release]
    code_elements: [helm_upgrade, kubectl_apply, rollback_deploy, run_pipeline]
  Monitoring:
    technical_concepts: [prometheus metric, grafana query, alert rule, latency histogram, trace span]
    code_elements: [RegisterMetric(), RecordLatency(), TriggerPagerAlert(), TraceSpan()]
  Incident Response:
    technical_concepts: [root cause fix, hotfix patch, emergency rollback, pagerduty triage, postmortem bugfix]
    code_elements: [ApplyEmergencyHotfix(), ResolveIncident(), PatchVulnerability()]
  Compliance:
    technical_concepts: [pci dss, pan masking, audit log, data retention, privacy scrubbing]
    code_elements: [MaskPAN(), LogAuditEvent(), ScrubSensitiveData(), EnforceRetention()]
  Data Analysis:
    technical_concepts: [transaction metrics, fraud rate trend, latency analysis, data aggregation]
    code_elements: [CalculateFraudTrend(), ComputeLatencyP99(), AggregateMetrics()]

