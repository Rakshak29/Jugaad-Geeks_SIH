      description: >
        E17 has 0 git commits in any codebase directory (docs activity only).

real_github_collaborator_plans:
  # Plans for live PRs, Reviews, and Issues to be executed by real accounts
  pr_plans:
    - plan_id: PR-REAL-01
      author_github: Rakshak29
      target_module: api-gateway
      title: "feat(api-gateway): add token bucket rate limiting middleware for v2 payment endpoints"
      branch: feature/gateway-rate-limiter
      files_changed:
        - services/api-gateway/rate_limiter.go
        - services/api-gateway/config/limits.json
      pr_body: >
        Implements a redis-backed token bucket rate limiter middleware for incoming payment intent proxy routes.
        Includes configurable burst limits and client IP throttling.

    - plan_id: PR-REAL-02
      author_github: keys246
      target_module: auth-service
      title: "sec(auth): enforce OAuth2 JWT claim verification and key rotation interval"
      branch: feature/jwt-claim-rotation
      files_changed:
        - services/auth/jwt_issuer.go
        - services/auth/rbac_middleware.go
      pr_body: >
        Updates JWT issuer to validate key rotation timestamps and restrict broad bearer scopes.

    - plan_id: PR-REAL-03
      author_github: krish-exe
      target_module: payment-service
      title: "refactor(payment): optimize card routing state machine retry backoff"
      branch: feature/payment-retry-optimization
      files_changed:
        - services/payment/retry_engine.go
        - services/payment/state_machine.go
      pr_body: >
        Adds exponential backoff with jitter to transient payment processor timeout retries.

  review_plans:
    - plan_id: REV-REAL-01
      pr_target_plan_id: PR-REAL-01
      reviewer_github: keys246
      state: APPROVED
      comments:
        - file: services/api-gateway/rate_limiter.go
          line: 42
          body: "Approved. Verified redis key TTL expiration logic prevents memory leaks during traffic spikes."

    - plan_id: REV-REAL-02
      pr_target_plan_id: PR-REAL-02
      reviewer_github: Rakshak29
      state: APPROVED
      comments:
        - file: services/auth/jwt_issuer.go
          line: 88
          body: "LGTM. The claim rotation fallback properly handles legacy bearer tokens during transition."

    - plan_id: REV-REAL-03
      pr_target_plan_id: PR-REAL-03
      reviewer_github: shadecodes10
      state: APPROVED
      comments:
        - file: services/payment/retry_engine.go
          line: 115
          body: "Verified against canary deployment. Backoff jitter reduces database lock contention significantly."

  issue_plans:
    - plan_id: ISS-REAL-01
      author_github: kshitijnaidu
      assignee_github: shadecodes10
      target_module: monitoring-service
      title: "bug(monitoring): Prometheus p99 latency spikes on payment-service router during peak hours"
      labels: [monitoring, performance, payment-service]
      issue_body: >
        Observed p99 latency exceeding 450ms on payment intent router proxy. Need to update Grafana trace filters
        and adjust alertmanager threshold.

    - plan_id: ISS-REAL-02
      author_github: NamanN-Creator
      assignee_github: NamanN-Creator
      target_module: reporting-service
      title: "feat(reporting): add daily settlement summary CSV exporter for merchant dashboard"
      labels: [reporting, ledger, settlement]
      issue_body: >
        Merchants require automated daily CSV exports of reconciled ACH clearing transactions.

    - plan_id: ISS-REAL-03
      author_github: shadecodes10
      assignee_github: kshitijnaidu
      target_module: deployment-service
      title: "infra(deploy): update Helm chart canary rollout timeout for payment-service v2.4 release"
      labels: [deployment, sre, kubernetes]
      issue_body: >
        Extend canary evaluation window from 5m to 15m to allow sufficient traffic sampling before auto-promotion.

