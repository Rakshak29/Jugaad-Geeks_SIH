      recent_commit_count: 0
      description: >
        E08 authored 25 commits on KMS vault & auth in 2023, but 0 commits in 2024-2026. Demonstrates stale evidence recency decay.

    case_3_multi_module:
      authors:
        - author: Rakshak29 (E01)
          modules: [api-gateway, payment-service, auth-service]
        - author: krish-exe (E04)
          modules: [payment-service, settlement-service, fraud-service]
        - author: shadecodes10 (E06)
          modules: [deployment-service, monitoring-service, api-gateway]
      description: >
        Seniors touch 3+ module path prefixes across history. Demonstrates multi-module expertise.

    case_4_distributed_knowledge:
      target_module: api-gateway
      authors: [Rakshak29 (E01), keys246 (E02), krish-exe (E04), shadecodes10 (E06), mpatel-infra (E11), nkapoor-dev (E15)]
      commit_count_each: 6
      description: >
        API Management evidence is evenly distributed across 6 engineers.

    case_5_identity_resolution:
