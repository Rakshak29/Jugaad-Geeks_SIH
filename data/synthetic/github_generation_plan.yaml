meta:
  plan_version: 1.0.0
  blueprint_reference: data/synthetic/blueprint.yaml
  created_at: 2026-08-26
  purpose: >
    Specification for generating realistic AcmePay GitHub commit history and planning
    live PRs, reviews, and issues for real GitHub team members.
    RAW GENERATED RECORDS MUST NEVER CONTAIN SHORTCUT GROUND TRUTH KEYS.

repository_architecture:
  organization: acmepay
  primary_repository: acmepay/engineering-monorepo
  branch_structure: [main, develop, feature/*, hotfix/*]
  
  modules:
    - module_name: payment-service
      path_prefix: services/payment/
      core_files:
        - services/payment/router.go
        - services/payment/intent_handler.go
        - services/payment/retry_engine.go
        - services/payment/card_processor.go
        - services/payment/state_machine.go

    - module_name: fraud-service
      path_prefix: services/fraud/
      core_files:
        - services/fraud/risk_evaluator.py
        - services/fraud/velocity_checker.py
        - services/fraud/ml_rules.py
        - services/fraud/blacklist_filter.py

    - module_name: auth-service
      path_prefix: services/auth/
      core_files:
        - services/auth/jwt_issuer.go
        - services/auth/oauth_handler.go
        - services/auth/kms_vault.go
        - services/auth/rbac_middleware.go

    - module_name: ledger-service
      path_prefix: services/ledger/
      core_files:
        - services/ledger/journal_entry.go
        - services/ledger/balance_verifier.go
        - services/ledger/double_entry.go
        - services/ledger/audit_trail.go

    - module_name: notification-service
      path_prefix: services/notification/
      core_files:
        - services/notification/webhook_dispatcher.go
        - services/notification/sms_gateway.go
        - services/notification/email_template.go

    - module_name: user-service
      path_prefix: services/user/
      core_files:
        - services/user/merchant_profile.go
        - services/user/kyc_verifier.go
        - services/user/account_controller.go

    - module_name: reporting-service
      path_prefix: services/reporting/
      core_files:
        - services/reporting/settlement_report.py
        - services/reporting/audit_exporter.py
        - services/reporting/daily_summary.py

    - module_name: settlement-service
      path_prefix: services/settlement/
      core_files:
        - services/settlement/ach_clearing.go
        - services/settlement/payout_batcher.go
        - services/settlement/bank_reconciliation.go

    - module_name: api-gateway
      path_prefix: services/api-gateway/
      core_files:
        - services/api-gateway/ingress_proxy.go
        - services/api-gateway/rate_limiter.go
        - services/api-gateway/openapi_spec.json
        - services/api-gateway/auth_plugin.go

    - module_name: deployment-service
      path_prefix: deployments/
      core_files:
        - deployments/helm/payment-service/values.yaml
        - deployments/k8s/canary_rollout.yaml
        - .github/workflows/deploy_production.yml
        - .github/workflows/ci_build.yml

    - module_name: monitoring-service
      path_prefix: monitoring/
      core_files:
        - monitoring/prometheus/payment_alerts.yml
        - monitoring/grafana/dashboards/latency.json
        - monitoring/pagerduty/routing_rules.json

    - module_name: compliance-service
      path_prefix: services/compliance/
      core_files:
        - services/compliance/pci_sanitizer.go
        - services/compliance/data_retention.go
        - services/compliance/audit_logger.go

